services:
  db:
    image: postgres:16-alpine
    container_name: party-photo-wall-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-photowall}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-photowall}
      - POSTGRES_DB=${POSTGRES_DB:-photowall}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photowall} -d ${POSTGRES_DB:-photowall}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  photowall:
    build: .
    container_name: party-photo-wall
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - MAX_UPLOAD_MB=15
      - DATABASE_URL=postgres://${POSTGRES_USER:-photowall}:${POSTGRES_PASSWORD:-photowall}@db:5432/${POSTGRES_DB:-photowall}
    restart: unless-stopped

volumes:
  pgdata:
